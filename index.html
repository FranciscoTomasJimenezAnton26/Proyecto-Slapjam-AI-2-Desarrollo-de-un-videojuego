<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0a14">
  <title>Doorbell Dash</title>

  <!-- Fuentes incluidas en el juego (funcionan sin internet). Licencias en assets/fonts/ -->
  <style>
    @font-face { font-family: "Luckiest Guy"; src: url("assets/fonts/LuckiestGuy.woff") format("woff"); font-display: block; }
    @font-face { font-family: "Fredoka"; src: url("assets/fonts/Fredoka.woff") format("woff"); font-weight: 300 700; font-display: block; }
  </style>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0a14;
      overflow: hidden;
      touch-action: none;          /* evita zoom y scroll al deslizar en el móvil */
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;  /* sin menú de "copiar/guardar imagen" al mantener pulsado */
    }
    #game { width: 100%; height: 100%; }

    /* Aviso de girar el móvil: solo en pantallas táctiles en horizontal y bajitas (móviles, no tablets) */
    #rotate {
      display: none; position: fixed; inset: 0; z-index: 10;
      background: #0d0a14; color: #f5ecff;
      font: 600 24px/1.4 "Fredoka", "Trebuchet MS", sans-serif;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center;
    }
    #rotate .icon { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="rotate"><div class="icon">📱</div><div>Rotate your phone<br>to play</div></div>

  <!-- Phaser: primero intenta la copia local (lib/phaser.min.js) y, si no existe, la CDN. -->
  <script src="lib/phaser.min.js"></script>
  <script>
    if (!window.Phaser) {
      document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"><\/script>');
    }
  </script>

  <!-- Código del juego (scripts normales, sin build: funciona con Live Server o subido a itch.io) -->
  <script src="src/config.js"></script>
  <script src="src/data/visitors.js"></script>
  <script src="src/assets.js"></script>
  <script src="src/records.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/swipe.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/visitor.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/PlayScene.js"></script>
  <script src="src/scenes/ResultsScene.js"></script>
  <script src="src/scenes/DebugScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
